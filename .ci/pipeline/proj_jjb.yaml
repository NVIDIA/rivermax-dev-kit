- job-template:
    name: "{jjb_proj}-{os}"
    project-type: pipeline
    folder: "{jjb_folder}"
    properties:
        - github:
            url: "https://github.com/Mellanox-lab/rivermax-dev-kit"
        - build-discarder:
            days-to-keep: 50
            num-to-keep: 20
        - inject:
            keep-system-variables: true
            properties-content: |
              jjb_proj={jjb_proj}-{os}
              job_path=rivermax-ci-{os}

    description: Do NOT edit this job through the Web GUI !
    concurrent: true
    sandbox: true
    parameters:
        - string:
            name: "sha1"
            default: "{jjb_branch}"
            description: "Commit to be checked, usually set by PR"
        - string:
            name: "DEBUG"
            default: 0
            description: "Enable debug prints and traces, valid values are 0-9"
        - string:
            name: "conf_file"
            default: ".ci/pipeline/job_matrix.yaml"
            description: "Regex to select job config file"
    triggers:
        - github-pull-request:
            cron: 'H/5 * * * *'
            trigger-phrase: '.*\bbot:(?:{os_short}:)?retest\b.*'
            status-context: "{jjb_proj}-{os}"
            success-status: "Build passed."
            failure-status: "Build failed."
            error-status:   "Build failed."
            status-add-test-results: true
            # svc-nbu-swx-media from GitHub Pull Request Builder
            auth-id: 'svc-nbu-swx-media_GHPRB_ID'
            org-list: ["Mellanox-lab"]
            allow-whitelist-orgs-as-admins: true
            cancel-builds-on-update: true
    pipeline-scm:
        scm:
            - git:
                url: "{jjb_git}"
                credentials-id: 'svc-nbu-swx-media_ssh_key'
                branches: ['$sha1']
                shallow-clone: false
                # depth: 10
                do-not-fetch-tags: false
                # honor-refspec: true
                refspec: "+refs/heads/*:refs/remotes/origin/* +refs/pull/*:refs/remotes/origin/pr/* +refs/tags/*:refs/remotes/origin/tags/*"
                browser: githubweb
                browser-url: "{jjb_git}"
                submodule:
                    disable: false
                    recursive: true
                    tracking: true
                    parent-credentials: true
        script-path: "{jjb_jenkinsfile}"

- project:
    name: rivermax-dev-kit
    os:
        - linux:
            os_short: lin
        - windows:
            os_short: win
    jjb_email: 'danielpr@nvidia.com'
    jjb_proj: 'rivermax-dev-kit-ci'
    jjb_git: 'git@github.com:Mellanox-lab/rivermax-dev-kit.git'
    jjb_owner: 'Daniel Pressler'
    jjb_jenkinsfile: '.ci/pipeline/Jenkinsfile'
    jjb_folder: 'rivermax'
    jjb_branch: 'master'
    jobs:
        - "{jjb_proj}-{os}"
