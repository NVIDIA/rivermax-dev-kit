---
job: rivermax-dev-kit-ci

# Fail job if one of the steps fails or continue
failFast: false

timeout_minutes: 240

env:
  SUBMODULE_NAME: rivermax-dev-kit

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: swx-media

runs_on_dockers:
  - { name: "groovy", url: "quay.io/podman/stable:v5.0.2", arch: 'x86_64'}

pipeline_start:
  shell: action
  module: groovy
  run: |
    currentBuild.description = currentBuild.description ?: ""
    currentBuild.displayName += "-${params.ghprbTargetBranch ?: sha1}"

steps:
  - name: Run Build
    shell: action
    module: groovy
    run: |
      if (env.JENKINS_URL == "https://nbupdc.blsm.nvidia.com/swx-media-master/") {
        job_path = "${job_path}-dr"
      }

      def build = build job: "rivermax/${job_path}",
        parameters: [
          string(name: 'SUBMODULES_OVERRIDE', value: "${SUBMODULE_NAME}:${env.ghprbActualCommit ?: sha1}")
        ],
        propagate: false

      def resultColor = build.result == 'SUCCESS' ? 'green' : 'red'
      currentBuild.description += "<br><b>Build:</b> <a href='${build.absoluteUrl}' style='color:${resultColor}'>${build.result} </a>"
      if (!build.resultIsBetterOrEqualTo('SUCCESS')) {
        currentBuild.result = build.result
        error("build failed")
      }
