---
job: rivermax-dev-kit-ci

# Fail job if one of the steps fails or continue
failFast: false

timeout_minutes: 240

env:
  SUBMODULE_NAME: rivermax-dev-kit

pipeline_start:
  shell: action
  module: groovy
  run: |
    currentBuild.description = currentBuild.description ?: ""
    currentBuild.displayName += "-${params.ghprbTargetBranch ?: sha1}"

runs_on_agents:
  - {nodeLabel: 'master', category: 'base'}

steps:
  - name: Run Linux Build
    shell: action
    module: groovy
    parallel: true
    run: |
      def build = build job: 'rivermax/rivermax-ci-linux',
        parameters: [
          string(name: 'SUBMODULES_OVERRIDE', value: "${SUBMODULE_NAME}:${env.ghprbActualCommit ?: sha1}")
        ],
        propagate: false

      def resultColor = build.result == 'SUCCESS' ? 'green' : 'red'
      currentBuild.description += "<br><b>Linux Build:</b> <a href='${build.absoluteUrl}' style='color:${resultColor}'>${build.result} </a>"
      if (!build.resultIsBetterOrEqualTo('SUCCESS')) {
        currentBuild.result = build.result
        error("Linux build failed")
      }


  - name: Run Windows Build
    shell: action
    module: groovy
    parallel: true
    run: |
      def build = build job: 'rivermax/rivermax-ci-windows',
        parameters: [
          string(name: 'SUBMODULES_OVERRIDE', value: "${SUBMODULE_NAME}:${env.ghprbActualCommit ?: sha1}")
        ],
        propagate: false

      def resultColor = build.result == 'SUCCESS' ? 'green' : 'red'
      currentBuild.description += "<br><b>Windows Build:</b> <a href='${build.absoluteUrl}' style='color:${resultColor}'>${build.result} </a>"
      if (!build.resultIsBetterOrEqualTo('SUCCESS')) {
        currentBuild.result = build.result
        error("Windows build failed")
      }

